events {
  worker_connections 1024;
}

http {
  upstream api {
    server api1:3000;
    server api2:3000;
  }

  server {
    listen 80;

    # API routes → load balanced between api1 and api2
    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (Socket.io) → sticky to one instance
    location /socket.io/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}